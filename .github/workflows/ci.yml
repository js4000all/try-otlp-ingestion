name: Go checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Temporary formatting output for PR correction
        run: |
          docker compose run --rm go gofmt -w cmd/otlpgen/main.go cmd/otlpgen/main_test.go internal/otlphttp/client.go internal/otlphttp/client_test.go
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              'cmd/otlpgen/main.go',
              'cmd/otlpgen/main_test.go',
              'internal/otlphttp/client.go',
              'internal/otlphttp/client_test.go',
          ]
          print('FORMATTED_JSON=' + json.dumps({path: Path(path).read_text() for path in paths}, ensure_ascii=True))
          PY
      - name: Reject unformatted changed Go files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.go')
          if (("${#files[@]}" == 0)); then
            echo "No changed Go files"
            exit 0
          fi
          unformatted="$(docker compose run --rm go gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check Go project inside Docker Compose
        run: make tidy && make fmt && make check
